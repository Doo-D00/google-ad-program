<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>Blogger AI 도구 — 설정</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic",sans-serif;max-width:560px;margin:40px auto;padding:0 20px;color:#1a202c}
h1{font-size:20px}h2{font-size:15px;margin-top:8px}
label{display:block;margin:16px 0 6px;font-weight:600}
input,select{width:100%;box-sizing:border-box;padding:10px;border:1px solid #cbd5e0;border-radius:8px;font-size:14px}
.card{background:#f7fafc;border:1px solid #edf2f7;border-radius:10px;padding:4px 16px 16px;margin-bottom:18px}
button{margin-top:16px;background:#6b46c1;color:#fff;border:none;border-radius:8px;padding:11px 18px;font-size:14px;font-weight:600;cursor:pointer}
button:hover{background:#553c9a}
.row{display:flex;gap:10px}
.status{margin-top:14px;font-size:13px;min-height:18px}.ok{color:#2f855a}.err{color:#c53030}
.hint{color:#718096;font-size:12px;margin-top:4px}a{color:#6b46c1}
</style>
</head>
<body>
<h1>Blogger AI 도구 설정</h1>

<div class="card">
  <h2>1) 글쓰기 — Claude (Anthropic)</h2>
  <label for="anthropicKey">Anthropic API 키</label>
  <input id="anthropicKey" type="password" placeholder="sk-ant-..." autocomplete="off" />
  <p class="hint">발급: <a href="https://console.anthropic.com/settings/keys" target="_blank" rel="noopener">console.anthropic.com</a></p>
  <label for="claudeModel">모델</label>
  <select id="claudeModel">
    <option value="claude-sonnet-5">claude-sonnet-5 (추천)</option>
    <option value="claude-haiku-4-5">claude-haiku-4-5 (빠름/저렴)</option>
    <option value="claude-opus-5">claude-opus-5 (최고 품질)</option>
  </select>
</div>

<div class="card">
  <h2>2) 썸네일 — Gemini (Google)</h2>
  <label for="geminiKey">Gemini API 키</label>
  <input id="geminiKey" type="password" placeholder="AIza..." autocomplete="off" />
  <p class="hint">발급: <a href="https://aistudio.google.com/app/apikey" target="_blank" rel="noopener">aistudio.google.com</a></p>
</div>

<div class="row">
  <button id="save">저장</button>
  <button id="test" style="background:#38a169;">글쓰기 키 테스트</button>
</div>
<div id="status" class="status"></div>

<script src="options.js"></script>
</body>
</html>
