<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>티스토리 글 초안 도구</title>
<link rel="stylesheet" href="app.css">
</head>
<body>

<header class="top">
  <h1>✦ 티스토리 글 초안 도구</h1>
  <div class="top-actions">
    <button id="copyHtml" class="primary" title="티스토리 HTML 모드에 붙여넣으세요">HTML 복사</button>
    <button id="saveHtml">.html 저장</button>
    <button id="settingsBtn" title="설정">설정</button>
  </div>
</header>

<p id="topStatus" class="topstatus"></p>

<main>
  <!-- ── 왼쪽: 생성 도구 ── -->
  <section class="pane left">

    <details open>
      <summary>1. 초안 생성</summary>
      <label>주제 키워드</label>
      <textarea id="kw" rows="3" placeholder="예) 초기창업패키지 작성방법"></textarea>
      <div class="row">
        <select id="topic" title="주제 분야 — 말투가 달라집니다"></select>
        <select id="lang"><option>한국어</option><option>English</option></select>
      </div>
      <button id="genText" class="primary">초안 생성</button>
      <p id="textStatus" class="status"></p>
      <p class="hint">일부러 빈칸을 남깁니다. <code>[내 경험]</code> <code>[실제 수치]</code>
        <code>[내 의견]</code> <code>[최신 확인]</code> 을 직접 채우세요.</p>
    </details>

    <details open>
      <summary>2. 제휴 버튼</summary>
      <div id="phList"></div>
      <p id="btnStatus" class="status"></p>
      <hr>
      <label>커서 위치에 버튼 직접 넣기</label>
      <input id="btnText" type="text" placeholder="버튼 텍스트">
      <input id="btnUrl" type="text" placeholder="https://... (제휴 링크)">
      <button id="insertButton" class="accent">본문 커서 위치에 삽입</button>
      <p class="hint">버튼은 <code>rel="nofollow sponsored"</code> 로 나갑니다. 고지 문구는 자동으로 붙습니다.</p>
    </details>

    <details open>
      <summary>3. 발행 전 점검</summary>
      <button id="runCheck">점검하기</button>
      <ul id="checkList" class="checks"></ul>
    </details>

  </section>

  <!-- ── 오른쪽: 본문 편집 + 미리보기 ── -->
  <section class="pane right">
    <div class="titlerow">
      <label>제목</label>
      <button id="newPost" class="tiny" title="제목과 본문을 비웁니다">새 글</button>
    </div>
    <input id="postTitle" type="text" placeholder="글 제목">

    <div class="tabs">
      <button class="tab active" data-view="html">본문 HTML</button>
      <button class="tab" data-view="preview">미리보기</button>
    </div>

    <textarea id="postBody" spellcheck="false" placeholder="여기에 본문 HTML이 들어갑니다. 빈칸을 직접 채우세요."></textarea>
    <!-- 생성된 본문에 script 가 섞여도 실행되지 않도록 샌드박스로 막는다. -->
    <iframe id="preview" class="hidden" title="미리보기" sandbox=""></iframe>
  </section>
</main>

<!-- ── 설정 ── -->
<dialog id="settingsDlg">
  <form method="dialog">
    <h2>설정</h2>
    <p class="hint">모든 값은 이 브라우저에만 저장됩니다(localStorage). 소스에는 들어가지 않습니다.</p>

    <h3>Gemini (글 생성)</h3>
    <label>Gemini API 키</label>
    <input id="sGeminiKey" type="password" placeholder="AIza...">
    <label>모델</label>
    <select id="sGeminiModel"></select>
    <button type="button" id="testGemini">키 테스트</button>
    <p class="hint">aistudio.google.com/app/apikey 에서 발급합니다.</p>

    <p id="settingsStatus" class="status"></p>
    <menu>
      <button value="cancel">닫기</button>
      <button id="saveSettings" value="save" class="primary">저장</button>
    </menu>
  </form>
</dialog>

<script type="module" src="js/app.js"></script>
</body>
</html>
